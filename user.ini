; ─────────────────────────────────────────────────────────────
; PHP-Upload-Limits für das Bewerbungsformular (bewerbung.php)
; Greift auf Hosting mit PHP-FPM/CGI (die meisten modernen Webspaces).
; Falls euer Host mod_php nutzt und diese Datei ignoriert, stattdessen
; in einer .htaccess ergänzen:
;   php_value upload_max_filesize 25M
;   php_value post_max_size 32M
;   php_value max_file_uploads 20
; ─────────────────────────────────────────────────────────────
upload_max_filesize = 25M
post_max_size = 32M
max_file_uploads = 20
